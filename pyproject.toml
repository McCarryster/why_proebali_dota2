[project]
name = "coach"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==1.13.0",
    "python-dotenv==1.2.1",
    "langfuse==4.17.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["coach", "coach.dota", "coach.systems"]
